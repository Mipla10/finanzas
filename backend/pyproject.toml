[project]
name = "finanzas"
version = "0.1.0"
description = "Núcleo de la app de finanzas personales (spec 001)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "psycopg[binary]>=3",
    "pydantic-settings>=2",
    "sqlalchemy>=2",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true          # mide también las ramas (if/else), plan §8.4
source = ["finanzas"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]   # única exclusión permitida

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E/F: errores básicos · I: orden de imports · UP: sintaxis moderna
# B: errores probables · SIM: simplificaciones
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# La carpeta backend/alembic/ se llama igual que la librería: aclararlo.
known-first-party = ["finanzas"]
known-third-party = ["alembic"]
